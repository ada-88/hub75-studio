text_sensor:
  # --- Plzeňka ---
  - platform: homeassistant
    id: stop_name_plzenka
    entity_id: sensor.plzenka_a_stop_name
    on_value:
      then:
        - lvgl.label.update:
            id: lbl_title_plzenka
            text: !lambda 'return x;'

  - platform: homeassistant
    id: plzenka_dep_1
    entity_id: sensor.plzenka_a_next_departure_time_1
    on_value:
      then:
        - script.execute: update_plzenka_rows
  - platform: homeassistant
    id: plzenka_route_1
    entity_id: sensor.plzenka_a_next_route_name_1
  - platform: homeassistant
    id: plzenka_headsign_1
    entity_id: sensor.plzenka_a_next_route_name_1
    attribute: "trip_headsign"

  - platform: homeassistant
    id: plzenka_dep_2
    entity_id: sensor.plzenka_a_next_departure_time_2
    on_value:
      then:
        - script.execute: update_plzenka_rows
  - platform: homeassistant
    id: plzenka_route_2
    entity_id: sensor.plzenka_a_next_route_name_2
  - platform: homeassistant
    id: plzenka_headsign_2
    entity_id: sensor.plzenka_a_next_route_name_2
    attribute: "trip_headsign"

  - platform: homeassistant
    id: plzenka_dep_3
    entity_id: sensor.plzenka_b_next_departure_time_1
    on_value:
      then:
        - script.execute: update_plzenka_rows
  - platform: homeassistant
    id: plzenka_route_3
    entity_id: sensor.plzenka_b_next_route_name_1
  - platform: homeassistant
    id: plzenka_headsign_3
    entity_id: sensor.plzenka_b_next_route_name_1
    attribute: "trip_headsign"

  - platform: homeassistant
    id: plzenka_dep_4
    entity_id: sensor.plzenka_b_next_departure_time_2
    on_value:
      then:
        - script.execute: update_plzenka_rows
  - platform: homeassistant
    id: plzenka_route_4
    entity_id: sensor.plzenka_b_next_route_name_2
  - platform: homeassistant
    id: plzenka_headsign_4
    entity_id: sensor.plzenka_b_next_route_name_2
    attribute: "trip_headsign"

sensor:
  - platform: homeassistant
    id: office_temperature
    entity_id: sensor.pm2_sensor_vindstyrka_1_temperature
    on_value:
      then:
        - lvgl.label.update:
            id: lbl_temp_plzenka
            text: !lambda 'return str_sprintf("%.1fC", x);'


  - platform: homeassistant
    id: weather
    entity_id: weather.forecast_home
    attribute: "temperature"
    on_value:
      then:
        - lvgl.label.update:
            id: lbl_weather_plzenka
            text: !lambda 'return str_sprintf("%.1fC", x);'


script:
  - id: update_plzenka_rows
    then:
      - lambda: |-
          time_t now_ts = id(ha_time).now().is_valid() ? id(ha_time).now().timestamp : 0;
          TramRow rows[4] = {
            {id(plzenka_route_1).state, id(plzenka_headsign_1).state, parse_iso_minutes(id(plzenka_dep_1).state, now_ts), id(plzenka_route_1).has_state()},
            {id(plzenka_route_2).state, id(plzenka_headsign_2).state, parse_iso_minutes(id(plzenka_dep_2).state, now_ts), id(plzenka_route_2).has_state()},
            {id(plzenka_route_3).state, id(plzenka_headsign_3).state, parse_iso_minutes(id(plzenka_dep_3).state, now_ts), id(plzenka_route_3).has_state()},
            {id(plzenka_route_4).state, id(plzenka_headsign_4).state, parse_iso_minutes(id(plzenka_dep_4).state, now_ts), id(plzenka_route_4).has_state()}
          };

          for(auto &r : rows) if(!r.valid) r.minutes = 99999.0f;
          std::sort(rows, rows+4, [](const TramRow& a, const TramRow& b){
            float ma = std::isnan(a.minutes) ? 99998.0f : a.minutes;
            float mb = std::isnan(b.minutes) ? 99998.0f : b.minutes;
            return ma < mb;
          });

          lv_obj_t* r_lbls[4] = {id(plz_r0), id(plz_r1), id(plz_r2), id(plz_r3)};
          lv_obj_t* h_lbls[4] = {id(plz_h0), id(plz_h1), id(plz_h2), id(plz_h3)};
          lv_obj_t* m_lbls[4] = {id(plz_m0), id(plz_m1), id(plz_m2), id(plz_m3)};

          for (int i=0; i<4; i++) {
            if (rows[i].valid) {
              lv_label_set_text(r_lbls[i], rows[i].route.c_str());
              lv_label_set_text(h_lbls[i], rows[i].headsign.c_str());
              if (std::isnan(rows[i].minutes)) lv_label_set_text(m_lbls[i], "...");
              else if (rows[i].minutes <= 0.9f) lv_label_set_text(m_lbls[i], "< 1");
              else {
                char mb[8];
                snprintf(mb, sizeof(mb), "%.0f", rows[i].minutes);
                lv_label_set_text(m_lbls[i], mb);
              }
            } else {
              lv_label_set_text(r_lbls[i], "");
              lv_label_set_text(h_lbls[i], "");
              lv_label_set_text(m_lbls[i], "");
            }
          }

lvgl_page_manager:
  pages:
    - page: page_timer${uid}
      friendly_name: "${page_friendly_name}"

