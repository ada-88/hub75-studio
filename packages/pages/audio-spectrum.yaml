# Audio Spectrum Page
# Real-time audio spectrum visualization using microphone input
# Uses lvgl-canvas-fx for dynamic spectrum bars
#
# Required vars:
#   page_friendly_name: Name of the page (e.g., Audio Spectrum)

lvgl_page_manager:
  pages:
    - page: fx_as_page
      friendly_name: "${page_friendly_name}"

external_components:
  - source: github://pavlov-net/lvgl-canvas-fx@v0.4.1

# ---- Microphone Configuration ----
# Hardware: I²S digital microphone
#
# Data format (verified):
# - 24-bit samples left-justified in 32-bit words
# - Raw values ≈ ±(0x00600000) with low 8 bits always 0x00 (padding)
# - Convert with (raw >> 8) / 2^23
#
# Signal characteristics (quiet room, from logs):
# - Time-domain RMS: typically −70 to −74 dBFS
# - Max instantaneous amplitude: ~0.001 in silence (post-scale)
# - Small DC/low-freq drift → high-pass required
#
# Processing notes:
# - High-pass filter coefficient ~0.995 used in code
# - sample_rate: 16000 (must match EqFftRenderer::setup fs)
# - With fs=16 kHz and fmax_frac≈0.46–0.47, bars top out near 7.5–8 kHz
microphone:
  - id: !extend ws_mic
    on_data:
      then:
        - lambda: |-
            id(cfx).submit_data(x.data(), x.size());
select:
  - platform: template
    id: fx_effect_select
    name: "FX Effect"
    optimistic: true
    options:
      - circle
      - fireworks
      - fireplace
      - aurora
      - plasma
      - breathing
      - clouds
      - sunset
      - starfield
      - snowfall
      - leaves
      - sakura
      - fireflies
      - warp
      - boids
      - ripples
      - matrix
      - sand
      - lightning
      - lava_lamp
      - rain
    initial_option: fireworks
    set_action:
      - lvgl_canvas_fx.set_effect:
          id: cfx
          effect: !lambda 'return x;'

lvgl_canvas_fx:
  - id: cfx
    effect: fireworks
    canvas: fx_as_canvas
    fps: 30
    start_paused: true

lvgl:
  pages:
    - id: fx_as_page
      widgets:
        - canvas:
            id: fx_as_canvas
            width: ${DISPLAY_W}
            height: ${DISPLAY_H}
      on_load:
        then:
          - lvgl_canvas_fx.resume:
              id: cfx
          - microphone.capture: ws_mic
      on_unload:
        then:
          - lvgl_canvas_fx.pause:
              id: cfx
          - microphone.stop_capture: ws_mic
