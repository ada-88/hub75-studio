# Share styles used between various packages

font:
  - file: "https://github.com/adobe-fonts/source-code-pro/raw/refs/heads/release/TTF/SourceCodePro-Regular.ttf"
    id: scp_8
    glyphs: |-
      ! "#$%&'()*+,-./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZŮŇČĎĚŘŠŤŽÁÉÍÓÚÝ[\]^_`abcdefghijklmnopqrstuvwxyzůňčďěřšťžáéíóúý°
    size: 10

  - file: "https://github.com/adobe-fonts/source-code-pro/raw/refs/heads/release/TTF/SourceCodePro-Regular.ttf"
    id: scp_12
    size: 12

  - file: "https://github.com/adobe-fonts/source-code-pro/raw/refs/heads/release/TTF/SourceCodePro-Regular.ttf"
    id: scp_16
    size: 16

lvgl:
  style_definitions:
    - id: style_bg_black
      bg_color: black
      text_color: white
    - id: st_spleen8
      text_font: scp_8
      text_color: white
    - id: st_spleen12
      text_font: scp_12
      text_color: white
    - id: st_spleen16
      text_font: scp_16
      text_color: white

  # Screen (display) background behind everything
  bottom_layer:
    bg_color: black

  # Make Spleen 8 the default font everywhere
  default_font: scp_8

  # Global defaults for *all* widgets
  bg_color: black
  text_color: white

  # Widget-specific theme defaults
  # Note: obj widgets have default styling (padding, borders, rounded corners, backgrounds)
  # that we don't want for our minimal display aesthetic, so we disable it here
  theme:
    obj:
      pad_all: 0
      border_width: 0
      radius: 0
      bg_opa: TRANSP
      text_color: white
